name: Auto-update KorDoc

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-update-kordoc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update KorDoc
        id: update
        shell: bash
        run: |
          npm update kordoc
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version and build
        if: steps.update.outputs.changed == 'true'
        run: |
          npm version patch --no-git-tag-version
          npm run build
          npm test

      - name: Commit and tag
        id: release
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: update kordoc to ${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish release to npm
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "$GITHUB_REF_NAME" -f tag="${{ steps.release.outputs.tag }}"
