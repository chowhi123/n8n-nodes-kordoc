name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"

      - name: Build and test
        run: |
          npm run build
          npm test

      - name: Publish package
        run: npm publish
